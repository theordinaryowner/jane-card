<html lang="en">

<title>Jane C. Rafael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: only light;
    --forest: #1E3A2B;
    --forest-deep: #16291F;
    --forest-line: #2E5140;
    --gold: #C69B4E;
    --soft-gold: #DCBE83;
    --cream: #F6F1E3;
    --sage: #9BB097;
    --display: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--forest-deep); }
  body {
    margin: 0;
    background: var(--forest);
    color: var(--cream);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px calc(36px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .card { width: 100%; max-width: 400px; }

  .name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 12px;
  }
  .roles {
    margin: 0 0 26px;
    padding: 0 0 0 13px;
    list-style: none;
    border-left: 1px solid var(--forest-line);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--sage);
  }
  .roles li:first-child { color: var(--soft-gold); }

  /* the arch: signature mark of the brand, used as the plate the code sits in */
  .arch {
    background: var(--cream);
    border-radius: 190px 190px 14px 14px;
    padding: 46px 26px 26px;
    display: flex;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(198,155,78,0.35);
  }
  .stack { position: relative; width: 100%; aspect-ratio: 1; }
  .panel {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
    transition: opacity .18s ease;
  }
  .panel.on { opacity: 1; visibility: visible; }
  .qr { width: 100%; height: 100%; display: block; }

  .now {
    text-align: center;
    margin: 16px 0 24px;
  }
  .now-t {
    font-family: var(--display);
    font-weight: 500;
    font-size: 16px;
    display: block;
  }
  .now-s {
    font-size: 13px;
    color: var(--sage);
    display: block;
    margin-top: 3px;
  }

  .rows { display: grid; gap: 7px; }
  .row {
    appearance: none;
    text-align: left;
    font: inherit;
    color: var(--cream);
    background: transparent;
    border: 1px solid var(--forest-line);
    border-radius: 11px;
    padding: 11px 14px;
    cursor: pointer;
    display: grid;
    gap: 1px;
    transition: background .14s ease, border-color .14s ease;
  }
  .row-t { font-family: var(--display); font-weight: 500; font-size: 14.5px; }
  .row-s { font-size: 12.5px; color: var(--sage); }
  .row.lead { border-color: var(--gold); }
  .row.lead .row-t { color: var(--soft-gold); }
  .row.on { background: var(--forest-deep); border-color: var(--gold); }
  .row.on .row-s { color: var(--soft-gold); }
  .row:focus-visible { outline: 2px solid var(--soft-gold); outline-offset: 2px; }

  .reach {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--forest-line);
    display: grid;
    gap: 9px;
    font-size: 14px;
  }
  .reach a { color: var(--cream); text-decoration: none; }
  .reach a:focus-visible { outline: 2px solid var(--soft-gold); outline-offset: 3px; }
  .reach span { color: var(--sage); font-size: 12px; display: block; margin-bottom: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .panel, .row { transition: none; }
  }
</style>
</head>
